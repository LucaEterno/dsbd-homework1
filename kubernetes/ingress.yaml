apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - progettoeternograsso.com
      secretName: tls-secret
  rules:
    - host: progettoeternograsso.com
      http:
        paths:
          - path: /api/users(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-manager-service
                port:
                  number: 80 # questa è la porta 80 del servizio
          - path: /api/data(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: data-collector-service
                port:
                  number: 80 # questa è la porta 80 del servizio

