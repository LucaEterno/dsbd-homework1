kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: myapp
nodes:
  - role: control-plane
    labels:
      custom-label: "control-plane"
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    labels:
      custom-label: "worker"
    extraPortMappings:
      - containerPort: 9090 # Porta del servizio nel cluster
        hostPort: 9090       # Porta sul tuo PC per Prometheus
      - containerPort: 8025 # Porta del servizio nel cluster
        hostPort: 8025       # Porta sul tuo PC per Mailhog

networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
